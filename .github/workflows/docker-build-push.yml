# ============================================================================
# FlatNas（本 fork）—— 构建多架构（amd64 + arm64）镜像并推送到 Docker Hub
#
# 怎么用（只在需要出新镜像时才跑，不会自动乱跑）：
#   GitHub 仓库页 → Actions → 左侧选「docker-build-push」
#   → 右侧 Run workflow → 填镜像标签（留空 = latest）→ Run
#
# 前置条件（每个仓库只需做一次）：
#   仓库 Settings → Secrets and variables → Actions → Secrets 分页 → New secret
#     DOCKERHUB_USERNAME = aaron2024s            ← 必须全小写
#     DOCKERHUB_TOKEN    = Docker Hub 访问令牌（不是登录密码）
#   必须建在 Secrets 分页，建在旁边的 Variables 分页等于没建。
#
# 注意：这个仓库是从上游 fork 出来的，Actions 默认**处于关闭状态**。
#   第一次要先打开仓库的 Actions 页，点「I understand my workflows, go ahead
#   and enable them」，否则 Run workflow 按钮点了也不会跑。
#
# 构建耗时：前端要 npm ci + vite build（容器内重编），后端要 go build，
#   arm64 走 QEMU 软件模拟（速度约原生的 1/5~1/10），且首次没有缓存 ——
#   第一次双架构预计 20~35 分钟，属正常。跑完会留下 GitHub 缓存，之后会明显变快。
# ============================================================================
name: docker-build-push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空 = latest）'
        required: false
        default: 'latest'
        type: string

  # 想让「打 git tag 就自动构建」：把下面两行的 # 去掉即可。
  # tag 名会直接当镜像标签用，例如 git tag v1.2.7 → 镜像 aaron2024s/flatnas:v1.2.7
  # push:
  #   tags: ['v*']

env:
  IMAGE_NAME: flatnas

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      # 只想要 x86（NAS 是 Intel/AMD）的话：删掉这一步，并把下面 platforms 里的
      #「,linux/arm64」去掉，构建能快一大截。
      # 后端本身支持交叉编译（Dockerfile 里用 --platform=$BUILDPLATFORM + TARGETARCH），
      # 但前端那一步没有编译型原生模块，QEMU 主要是给整个 arm64 构建兜底。
      - name: 准备 QEMU（构建 arm64 用）
        uses: docker/setup-qemu-action@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 手动触发时用你填的标签；若改用 tag 触发，则自动用 tag 名
          tags: ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把结果写进运行摘要，跑完在页面顶部能直接看到镜像名和 digest
      - name: 结果汇总
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 名称：\`$DOCKERHUB_USER/$IMAGE_NAME:${{ inputs.tag || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构：\`linux/amd64, linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 摘要：\`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 拉取：\`docker pull $DOCKERHUB_USER/$IMAGE_NAME:${{ inputs.tag || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
